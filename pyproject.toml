[project]
name = "mcp-context-toolkit"
version = "1.0.0rc6"
description = "Feed any AI agent the right context on demand — file-scoped rules, frecency-ranked memory, and a navigable link-graph, from plain markdown/YAML stores (OKF-compatible)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Othmar Atzmüller" }]
requires-python = ">=3.11"
keywords = ["mcp", "rules", "memory", "frecency", "context", "ai-agents", "knowledge-graph", "okf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "mcp>=1.0",
]

[project.urls]
Homepage = "https://github.com/othmaratzmueller-bit/mcp-context-toolkit"
Repository = "https://github.com/othmaratzmueller-bit/mcp-context-toolkit"
Issues = "https://github.com/othmaratzmueller-bit/mcp-context-toolkit/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
context-toolkit-mcp = "mcp_context_toolkit.mcp_server:main"
context-toolkit-query = "mcp_context_toolkit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcp_context_toolkit = ["viewer/*.html", "viewer/*.js", "method/*.md"]

# ---------------------------------------------------------------------------
# Lint configuration — deliberately EXPLICIT.
#
# This package previously shipped no ruff config at all, which meant CI linted
# it against whatever ruff's DEFAULT rule set happened to be. That default is
# not stable across releases: 0.16.0 switched on whole additional families
# (bandit, bugbear, async, pyupgrade …) and turned a green tree red without a
# line of code changing. Pinning the version in CI limits the blast radius;
# stating the rules here is what actually makes the check reproducible.
#
# Rules are chosen for a published library rather than for an application:
# correctness and API hygiene matter, stylistic opinions are kept out.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
# Not enforced as a lint error (see E501 below); this value is what isort wraps
# import blocks against. At the default 88 the long model import would be split.
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes — undefined names, unused imports
    "I",      # import sorting (a library should not force a diff on consumers)
    "UP",     # pyupgrade — the package requires 3.11+, so use its syntax
    "B",      # bugbear — real bug patterns, not style
    "SIM",    # simplifications that genuinely read better
    "C4",     # comprehension clarity
]
ignore = [
    # Long lines are tolerated in prose (docstrings explain WHY, and wrapping
    # them mid-sentence hurts more than it helps). No formatter runs here, so
    # nothing rewrites them either — this is a deliberate non-rule, not a
    # deferral to some other tool.
    "E501",
]
