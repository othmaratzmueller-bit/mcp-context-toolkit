name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # ruff is PINNED on purpose. A linter defines by version what counts
          # as an error, so an unpinned one makes the build depend on someone
          # else's release schedule: 0.16.0 turned on additional default rules
          # and broke CI for a commit tree that had not changed. Bump this
          # deliberately, with the cleanup in the same commit.
          pip install -e ".[dev]" "ruff==0.16.0" build

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Test (pytest)
        run: pytest -q

      - name: Build (sdist + wheel)
        run: python -m build
