# Custom Domain Manifest for mcp-context-toolkit
# A named VIEW over this project's own rules store — no separate data,
# just a filtered slice: security + code-quality rules at non_negotiable
# or mandatory priority. See the "Domains" section in README.md.

id: code_quality
title: "Code Quality & Security Guidelines"
profile: rules
source: rules   # view over the existing rules store, not a separate copy

filter:
  types:
    - security
    - code_quality
  priorities:
    - non_negotiable
    - mandatory

attributes:
  owner: "Architecture Team"
