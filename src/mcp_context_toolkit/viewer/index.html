<!DOCTYPE html>
<!-- Context Studio — offline, zero-dependency viewer for the mcp-context-toolkit.
     by Othmar Atzmüller · MIT.
     Two modes:
       • Review  — load a skill's diff.json (the preview-gate), accept/reject each
                   proposal, export decision.json (Blob download — no backend).
       • Browse  — read-only view of memory.json (packages by tier, frecency heat)
                   and rules.json (rules by category, priority).
     Data sources, in order: window.CONTEXT_DATA (injected *-data.js) → fetch of
     ./memory.json|./rules.json|./diff.json (served) → drag-and-drop (file://).
     XSS-safe: ALL data is rendered via textContent / createElement, never innerHTML
     with data — the viewer dogfoods the toolkit's own escape_user_data_in_html rule. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Context Studio</title>
  <style>
    /* ---- theme: dark is the default; [data-theme="light"] overrides ----
       Applied before first paint (see the inline script in <head>) so there is
       no FOUC flash on reload. Toggle persists in localStorage("ctx-theme"). */
    :root {
      --bg:#0f1218; --panel:#171b22; --panel2:#1d222b; --line:#2a313d;
      --fg:#e3e8f0; --muted:#8b94a6; --accent:#7c9cf0; --accent-dim:#3a4a78;
      --ok:#5fc99a; --warn:#e0b15a; --danger:#d97b86; --merge:#54c1b8; --info:#8b94a6;
      --core:#7c9cf0; --project:#54c1b8; --user:#e0b15a; --unknown:#8b94a6;
      --shadow:0 1px 3px rgba(0,0,0,.35);
      --shadow-lg:0 8px 28px rgba(0,0,0,.45);
      --scrim:rgba(0,0,0,.5);
    }
    [data-theme="light"] {
      --bg:#f7f8fa; --panel:#ffffff; --panel2:#f0f2f5; --line:#e2e6ec;
      --fg:#1a1f26; --muted:#6b7280; --accent:#4263eb; --accent-dim:#c3d0ff;
      --ok:#0ca678; --warn:#e8a33d; --danger:#e0384f; --merge:#0ca678; --info:#6b7280;
      --core:#4263eb; --project:#0ca678; --user:#e8a33d; --unknown:#6b7280;
      --shadow:0 1px 2px rgba(15,23,42,.06);
      --shadow-lg:0 8px 24px rgba(15,23,42,.12);
      --scrim:rgba(15,23,42,.35);
    }
    * { box-sizing:border-box; }
    /* Fill the container EXACTLY (works standalone and inside a fixed-height iframe)
       so the document never scrolls — only `main` and the drawer do, one scrollbar
       per pane. min-height:100vh would overflow a shorter iframe and add a spurious
       document-level scrollbar on top of main's. */
    html, body { height:100%; }
    body { margin:0; height:100%; overflow:hidden; display:flex; flex-direction:column;
           font:14px/1.5 system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--fg);
           font-feature-settings:"cv02","cv03","cv04"; transition:background .2s ease,color .2s ease; }
    /* Subtle, theme-matched scrollbars (the default chrome looks heavy on dark). */
    main::-webkit-scrollbar, .drawer::-webkit-scrollbar { width:10px; }
    main::-webkit-scrollbar-track, .drawer::-webkit-scrollbar-track { background:transparent; }
    main::-webkit-scrollbar-thumb, .drawer::-webkit-scrollbar-thumb { background:var(--line); border-radius:5px; }
    main:hover::-webkit-scrollbar-thumb, .drawer:hover::-webkit-scrollbar-thumb { background:var(--accent-dim); }
    .topbar { display:flex; align-items:center; gap:16px; padding:12px 18px;
              background:var(--panel); border-bottom:1px solid var(--line); flex:none; }
    .brand { display:flex; align-items:center; gap:8px; font-size:15px; font-weight:600;
             letter-spacing:.01em; white-space:nowrap; }
    .brand svg { width:20px; height:20px; flex:none; }
    .tabs { display:flex; gap:2px; }
    .tabs button { padding:7px 14px; background:transparent; border:none;
                   border-bottom:2px solid transparent; color:var(--muted); font-size:13px;
                   cursor:pointer; transition:color .12s ease,border-color .12s ease; }
    .tabs button:hover { color:var(--fg); }
    .tabs button.active { color:var(--fg); border-bottom-color:var(--accent); }
    .spacer { flex:1; }
    .search { padding:7px 11px; background:var(--bg); border:1px solid var(--line);
              border-radius:8px; color:var(--fg); font-size:13px; width:230px;
              transition:border-color .12s ease,box-shadow .12s ease; }
    .search:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim); }
    .btn { padding:7px 13px; border:1px solid var(--accent-dim); background:rgba(124,156,240,.14);
           color:var(--accent); border-radius:8px; font-size:13px; cursor:pointer;
           transition:background .12s ease,transform .05s ease; }
    .btn:hover { background:rgba(124,156,240,.26); }
    .btn:active { transform:translateY(1px); }
    .btn:disabled { opacity:.4; cursor:not-allowed; }
    .btn.ghost { border-color:var(--line); background:transparent; color:var(--muted); }
    .btn.ghost:hover { background:var(--panel2); color:var(--fg); }
    .icon-btn { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px;
                padding:0; border:1px solid var(--line); background:transparent; color:var(--muted);
                border-radius:8px; cursor:pointer; transition:color .12s ease,border-color .12s ease; }
    .icon-btn:hover { color:var(--fg); border-color:var(--accent-dim); }
    .icon-btn svg { width:16px; height:16px; }
    /* Theme-toggle icons: show the sun in dark mode (click → go light),
       show the moon in light mode (click → go dark). */
    .icon-btn .icon-moon { display:none; }
    [data-theme="light"] .icon-btn .icon-sun { display:none; }
    [data-theme="light"] .icon-btn .icon-moon { display:block; }
    main { flex:1; overflow-y:auto; padding:18px; }
    .wrap { max-width:980px; margin:0 auto; }
    .summary { color:var(--muted); font-size:13px; margin-bottom:14px; display:flex;
               align-items:center; gap:14px; flex-wrap:wrap; }
    .summary b { color:var(--fg); }
    .subtabs { display:flex; gap:6px; margin-bottom:14px; }
    .subtabs button { padding:5px 12px; background:var(--panel); border:1px solid var(--line);
                      border-radius:7px; color:var(--muted); font-size:12px; cursor:pointer;
                      transition:color .12s ease,border-color .12s ease; }
    .subtabs button:hover { color:var(--fg); }
    .subtabs button.active { color:var(--fg); border-color:var(--accent-dim); }
    .kpi-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; }
    .kpi-tile { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
    .kpi-value { font-size:26px; font-weight:600; color:var(--fg); line-height:1.1; }
    .kpi-label { font-size:12px; color:var(--muted); margin-top:4px; }
    .kpi-sub { font-size:11px; color:var(--muted); margin-top:6px; opacity:.8; }
    .edit-form { display:flex; flex-direction:column; gap:12px; margin-bottom:14px; }
    .field-row { display:flex; flex-direction:column; gap:4px; }
    .field-label { font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
    .edit-form textarea.search { resize:vertical; font-family:inherit; }
    .edit-form select.search { cursor:pointer; }
    .field-row input[type="checkbox"] { width:16px; height:16px; accent-color:var(--accent); }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:10px;
            padding:13px 15px; margin-bottom:10px; box-shadow:var(--shadow);
            transition:border-color .12s ease,box-shadow .12s ease; }
    .card:hover { border-color:var(--accent-dim); }
    .card .head { display:flex; align-items:center; gap:10px; }
    .card .title { font-weight:600; font-size:13.5px; word-break:break-word; }
    .card .detail { color:var(--muted); font-size:12.5px; margin-top:6px; white-space:pre-wrap; }
    .badge { font-size:10.5px; padding:2px 8px; border-radius:20px; font-weight:600;
             text-transform:uppercase; letter-spacing:.03em; flex:none; }
    .ba-prune,.ba-flag { background:rgba(217,123,134,.16); color:var(--danger); }
    .ba-compact { background:rgba(224,177,90,.16); color:var(--warn); }
    .ba-merge { background:rgba(84,193,184,.16); color:var(--merge); }
    .ba-reclassify,.ba-rename,.ba-reorder { background:rgba(124,156,240,.16); color:var(--accent); }
    .ba-link_fix,.ba-normalize { background:rgba(139,148,166,.16); color:var(--info); }
    .tier-core { background:rgba(124,156,240,.16); color:var(--core); }
    .tier-project { background:rgba(84,193,184,.16); color:var(--project); }
    .tier-user { background:rgba(224,177,90,.16); color:var(--user); }
    .tier-unknown { background:rgba(139,148,166,.16); color:var(--unknown); }
    .prio-non_negotiable { background:rgba(217,123,134,.16); color:var(--danger); }
    .prio-mandatory { background:rgba(224,177,90,.16); color:var(--warn); }
    .prio-recommended { background:rgba(139,148,166,.16); color:var(--info); }
    .status-open { background:rgba(139,148,166,.16); color:var(--info); }
    .status-active { background:rgba(124,156,240,.16); color:var(--accent); }
    .status-done { background:rgba(84,193,184,.16); color:var(--ok); }
    .status-dropped,.status-superseded { background:rgba(217,123,134,.16); color:var(--danger); }
    .meta { color:var(--muted); font-size:11.5px; flex:none; }
    .chk { width:16px; height:16px; accent-color:var(--accent); cursor:pointer; flex:none; }
    .diff { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:9px; }
    .diff .col { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px;
                 font:12px/1.45 ui-monospace,Menlo,monospace; white-space:pre-wrap; word-break:break-word;
                 max-height:220px; overflow-y:auto; }
    .diff .col h4 { margin:0 0 5px; font:600 10px/1 system-ui; text-transform:uppercase;
                    letter-spacing:.04em; color:var(--muted); }
    .col.before { border-left:2px solid var(--danger); }
    .col.after { border-left:2px solid var(--ok); }
    .move { margin-top:8px; font:12px/1.4 ui-monospace,monospace; color:var(--fg); }
    .move .arrow { color:var(--accent); margin:0 7px; }
    .evidence { margin-top:8px; padding:7px 10px; background:var(--bg); border-radius:8px;
                border-left:2px solid var(--muted); font-size:12px; color:var(--muted); white-space:pre-wrap; }
    .heat { display:inline-block; width:60px; height:6px; background:var(--line); border-radius:3px;
            overflow:hidden; vertical-align:middle; }
    .heat i { display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--warn));
              transition:width .3s ease; }
    .row { display:flex; align-items:center; gap:11px; padding:9px 13px; background:var(--panel);
           border:1px solid var(--line); border-radius:9px; margin-bottom:7px; cursor:pointer;
           transition:border-color .12s ease,background .12s ease; }
    .row:hover { border-color:var(--accent-dim); background:var(--panel2); }
    .row .nm { font-weight:600; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .row .desc { color:var(--muted); font-size:12px; flex:1; overflow:hidden; text-overflow:ellipsis;
                 white-space:nowrap; }
    .group-title { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);
                   margin:16px 0 8px; display:flex; gap:8px; align-items:center; }
    .empty { text-align:center; color:var(--muted); padding:60px 20px; }
    .drop { border:2px dashed var(--line); border-radius:12px; padding:48px 24px; text-align:center;
            color:var(--muted); cursor:pointer; transition:border-color .12s ease,background .12s ease,color .12s ease; }
    .drop:hover { border-color:var(--accent-dim); }
    .drop.over { border-color:var(--accent); color:var(--fg); background:var(--panel); }
    .drop input { display:none; }
    .drawer { position:fixed; top:0; right:0; width:min(560px,92vw); height:100vh; background:var(--panel);
              border-left:1px solid var(--line); padding:18px 20px; overflow-y:auto; transform:translateX(100%);
              transition:transform .18s ease; z-index:30; box-shadow:var(--shadow-lg); }
    .drawer.open { transform:translateX(0); }
    .drawer h2 { margin:0 0 3px; font-size:16px; word-break:break-word; }
    .drawer .sub { color:var(--muted); font-size:12px; margin-bottom:14px; }
    .drawer pre { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:12px 14px;
                  white-space:pre-wrap; word-break:break-word; font:12.5px/1.5 ui-monospace,monospace; }
    .drawer .close-btn { position:absolute; top:14px; right:16px; background:transparent; border:none;
                         color:var(--muted); font-size:22px; cursor:pointer; line-height:1;
                         transition:color .12s ease; }
    .drawer .close-btn:hover { color:var(--fg); }
    .scrim { position:fixed; inset:0; background:var(--scrim); opacity:0; pointer-events:none;
             transition:opacity .18s; z-index:20; }
    .scrim.open { opacity:1; pointer-events:auto; }
    .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
    .chip { font-size:11px; padding:2px 9px; background:var(--bg); border:1px solid var(--line);
            border-radius:16px; color:var(--muted); }
    .ledger { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px;
              white-space:pre-wrap; word-break:break-word; font:12.5px/1.55 ui-monospace,Menlo,monospace;
              color:var(--fg); box-shadow:var(--shadow); }
    /* Graph host — Cytoscape needs an explicit height on its container. Fills the
       viewport below the summary line; the container itself never scrolls (cy pans). */
    .graph { height:calc(100vh - 190px); min-height:420px; background:var(--panel);
             border:1px solid var(--line); border-radius:10px; overflow:hidden; box-shadow:var(--shadow); }
    .glegend { display:flex; gap:12px; flex-wrap:wrap; margin-left:auto; }
    .glegend span { display:inline-flex; align-items:center; gap:5px; }
    .glegend i { width:9px; height:9px; border-radius:50%; display:inline-block; }
    footer { flex:none; padding:9px 18px; border-top:1px solid var(--line); background:var(--panel);
             color:var(--muted); font-size:11.5px; display:flex; gap:8px; align-items:center; }
    footer a { color:var(--accent); text-decoration:none; }
    footer a:hover { text-decoration:underline; }
  </style>
  <!-- Apply the saved theme BEFORE first paint — avoids a flash of the wrong theme on reload. -->
  <script>
    (function(){ try { var t = localStorage.getItem("ctx-theme") || "dark";
      if (t === "light") document.documentElement.setAttribute("data-theme","light"); } catch(_){} })();
  </script>
</head>
<body>
  <div class="topbar">
    <span class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="ctx-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#7c9cf0"/><stop offset="1" stop-color="#54c1b8"/>
          </linearGradient>
        </defs>
        <g stroke="url(#ctx-grad)" stroke-width="2.5" stroke-linecap="round" opacity="0.55">
          <line x1="16" y1="16" x2="32" y2="32"/><line x1="48" y1="16" x2="32" y2="32"/><line x1="32" y1="50" x2="32" y2="32"/>
        </g>
        <circle cx="16" cy="16" r="6" fill="#7c9cf0"/><circle cx="48" cy="16" r="6" fill="#54c1b8"/><circle cx="32" cy="50" r="6" fill="#e0b15a"/>
        <circle cx="32" cy="32" r="8.5" fill="none" stroke="url(#ctx-grad)" stroke-width="2.5"/>
        <circle cx="32" cy="32" r="4" fill="url(#ctx-grad)"/>
      </svg>
      Context Studio
    </span>
    <div class="tabs">
      <button id="tab-review" class="active">Review</button>
      <button id="tab-browse">Browse</button>
      <button id="tab-graph">Graph</button>
      <button id="tab-pending">Pending</button>
      <button id="tab-status">Status</button>
    </div>
    <span class="spacer"></span>
    <input id="search" class="search" placeholder="Filter…" autocomplete="off">
    <button id="export" class="btn" disabled>Export decision.json</button>
    <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme" title="Toggle theme">
      <!-- Sun (shown in dark mode) / Moon (shown in light mode) — swapped via CSS. -->
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </div>

  <main><div class="wrap" id="content"></div></main>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer">
    <button class="close-btn" id="drawer-close" aria-label="Close">×</button>
    <div id="drawer-body"></div>
  </aside>

  <footer>
    <span>Context Studio — by <a href="https://github.com/othmaratzmueller-bit" target="_blank" rel="noopener">Othmar Atzmüller</a></span>
    <span>·</span>
    <a href="https://github.com/othmaratzmueller-bit/mcp-context-toolkit" target="_blank" rel="noopener">mcp-context-toolkit</a>
    <span>· MIT</span>
    <span class="spacer" style="flex:1"></span>
    <span id="status"></span>
  </footer>

  <!-- Cytoscape (MIT, vendored next to this file, copied by --export-studio). Optional:
       the Graph tab degrades to a hint if it is absent (pure standalone index.html). -->
  <script src="cytoscape.min.js"></script>
  <script>
  "use strict";
  // ---- tiny DOM builder — text always via textContent (XSS-safe by construction) ----
  function el(tag, props, ...kids) {
    const n = document.createElement(tag);
    if (props) for (const k in props) {
      if (k === "class") n.className = props[k];
      else if (k === "text") n.textContent = props[k];
      else if (k === "onclick") n.onclick = props[k];
      else if (k === "html") throw new Error("innerHTML is forbidden for data");
      else n.setAttribute(k, props[k]);
    }
    for (const c of kids) if (c != null) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    return n;
  }
  const $ = id => document.getElementById(id);
  const clear = node => { while (node.firstChild) node.removeChild(node.firstChild); };

  const STATE = { mode:"review", browseTab:"memory", data:{}, q:"", decisions:{} };

  // ---------------- data loading (injected → fetch → drop) ----------------
  // Injected CONTEXT_DATA wins PER KEY; any data key it does not supply is still
  // fetched. So a host can inject only the hooks (fetchBody/fetchPending) and the
  // viewer still loads memory.json/rules.json from disk — while a host that injects
  // full data short-circuits the fetch for those keys (no wasted requests).
  async function loadData() {
    const out = { ...(window.CONTEXT_DATA || {}) };
    for (const [key, file] of [["memory","memory.json"],["rules","rules.json"],["diff","diff.json"]]) {
      if (out[key]) continue;
      try { const r = await fetch(file, { cache:"no-store" }); if (r.ok) out[key] = await r.json(); }
      catch (_) { /* file:// or missing — fall through to drop zone */ }
    }
    // work/docs metadata is NOT a safe static-file default the way memory/
    // rules is (a work-item title or a docs/ heading tree can itself be the
    // sensitive content) — so there is no bare `fetch(file)` fallback here.
    // A host that wants the Work/Docs tabs populated must inject an ASYNC
    // loader (`fetchWorkIndex`/`fetchDocsIndex`, awaited at boot, same shape
    // as `--export-studio`'s work.json/docs.json) behind its own auth — see
    // talos-data.js. Without one, the tabs just show "no data" (same empty
    // state as a missing rules.json), never an unauthenticated file guess.
    for (const [key, loaderKey] of [["work","fetchWorkIndex"],["docs","fetchDocsIndex"]]) {
      if (out[key] || typeof out[loaderKey] !== "function") continue;
      try { out[key] = await out[loaderKey](); }
      catch (e) {
        // A host DID wire this loader, so a throw here means the request
        // actually failed (401 from an expired session, 500, network) —
        // not "no data source configured", which is the case skipped by
        // the `typeof ... !== "function"` check above. Surfacing the
        // message (console + the tab's own empty-state text below) keeps
        // "host never configured this" and "host configured it and it
        // broke" visually distinct instead of both reading as an
        // identical blank tab.
        out[key + "Error"] = (e && e.message) ? String(e.message) : String(e);
        console.error("[context-studio] " + loaderKey + "() failed:", e);
      }
    }
    return out;
  }

  // ---------------- REVIEW (diff.json preview-gate) ----------------
  function renderReview() {
    const c = $("content"); clear(c);
    const diff = STATE.data.diff;
    if (!diff || !Array.isArray(diff.items) || !diff.items.length) { renderDropZone(c); return; }

    // Seed each item's accept/reject from its `default` (default true unless the
    // proposal explicitly sets default:false, e.g. a flagged-for-human item) so
    // the checkbox, the accepted count and the exported decision.json all agree.
    for (const it of diff.items) {
      if (STATE.decisions[it.id] === undefined) STATE.decisions[it.id] = (it.default !== false);
    }

    const items = filterItems(diff.items);
    const accepted = items.filter(it => STATE.decisions[it.id] !== false).length;

    const summary = el("div", { class:"summary" });
    summary.appendChild(el("span", {}, el("b", { text:String(diff.items.length) }), " proposals"));
    if (diff.tool) summary.appendChild(el("span", { class:"badge ba-merge", text:diff.tool }));
    if (diff.summary) summary.appendChild(el("span", { text:diff.summary }));
    summary.appendChild(el("span", {}, el("b", { id:"acc-count", text:String(accepted) }), " accepted"));
    summary.appendChild(el("button", { class:"btn ghost", onclick:()=>{ setAll(diff.items,true); } }, "Accept all"));
    summary.appendChild(el("button", { class:"btn ghost", onclick:()=>{ setAll(diff.items,false); } }, "Reject all"));
    c.appendChild(summary);

    if (!items.length) { c.appendChild(el("div", { class:"empty", text:"No proposals match the filter." })); return; }
    for (const it of items) c.appendChild(reviewCard(it));
    updateExport();
  }

  function reviewCard(it) {
    const op = it.op || "change";
    const card = el("div", { class:"card" });
    const head = el("div", { class:"head" });
    const chk = el("input", { type:"checkbox", class:"chk" });
    chk.checked = STATE.decisions[it.id] !== false;
    chk.onchange = () => { STATE.decisions[it.id] = chk.checked; updateExport(); updateAccCount(); };
    head.appendChild(chk);
    head.appendChild(el("span", { class:"badge ba-" + op, text:op }));
    head.appendChild(el("span", { class:"title", text:it.title || it.id || "(unnamed)" }));
    if (typeof it.saved_bytes === "number") {
      const sign = it.saved_bytes >= 0 ? "−" : "+";
      head.appendChild(el("span", { class:"meta", text:sign + Math.abs(it.saved_bytes) + " B" }));
    }
    card.appendChild(head);

    if (it.detail) card.appendChild(el("div", { class:"detail", text:it.detail }));
    if (it.from || it.to) {
      const m = el("div", { class:"move" });
      m.appendChild(document.createTextNode(it.from || "—"));
      m.appendChild(el("span", { class:"arrow", text:"→" }));
      m.appendChild(document.createTextNode(it.to || "—"));
      card.appendChild(m);
    }
    if (it.before != null || it.after != null) {
      const d = el("div", { class:"diff" });
      d.appendChild(el("div", { class:"col before" }, el("h4", { text:"before" }), document.createTextNode(it.before || "")));
      d.appendChild(el("div", { class:"col after" }, el("h4", { text:"after" }), document.createTextNode(it.after || "")));
      card.appendChild(d);
    }
    if (it.evidence) card.appendChild(el("div", { class:"evidence", text:it.evidence }));
    return card;
  }

  function setAll(items, val) {
    for (const it of items) { STATE.decisions[it.id] = val; }
    renderReview();
  }
  function updateAccCount() {
    const diff = STATE.data.diff; if (!diff || !Array.isArray(diff.items)) return;
    const n = filterItems(diff.items).filter(it => STATE.decisions[it.id] !== false).length;
    const span = $("acc-count"); if (span) span.textContent = String(n);
  }
  function updateExport() {
    const has = STATE.data.diff && Array.isArray(STATE.data.diff.items) && STATE.data.diff.items.length;
    $("export").disabled = !has;
  }

  function exportDecision() {
    const diff = STATE.data.diff; if (!diff || !Array.isArray(diff.items)) return;
    const accepted = [], rejected = [];
    for (const it of diff.items) (STATE.decisions[it.id] !== false ? accepted : rejected).push(it.id);
    const decision = { kind:"context-studio/decision", tool:diff.tool || null, accepted, rejected };
    const blob = new Blob([JSON.stringify(decision, null, 2)], { type:"application/json" });
    const a = el("a", { href:URL.createObjectURL(blob), download:"decision.json" });
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
    setStatus(accepted.length + " accepted / " + rejected.length + " rejected → decision.json");
  }

  function renderDropZone(c) {
    const dz = el("div", { class:"drop" },
      el("div", { text:"Drop a diff.json here, or click to choose" }),
      el("div", { class:"meta", text:"a skill's preview-gate proposal (context-dream / prune / compact / classify)" }));
    const input = el("input", { type:"file", accept:".json,application/json" });

    dz.onclick = () => input.click();
    dz.ondragover = e => { e.preventDefault(); dz.classList.add("over"); };
    dz.ondragleave = () => dz.classList.remove("over");
    dz.ondrop = e => { e.preventDefault(); dz.classList.remove("over"); if (e.dataTransfer.files[0]) readDiffFile(e.dataTransfer.files[0]); };
    c.appendChild(dz);
  }
  function readDiffFile(file) {
    const r = new FileReader();
    r.onload = () => {
      try { STATE.data.diff = JSON.parse(r.result); STATE.decisions = {}; setStatus("loaded " + file.name); renderReview(); }
      catch (err) { setStatus("invalid JSON: " + err.message); }

    r.readAsText(file);
  }

  // Drill down to a package's full body (incl. its `## <member>` sections). The
  // body is NOT in the metadata snapshot — it is host-supplied: window.CONTEXT_DATA
  // .fetchBody(name) -> Promise<string>, or a pre-injected p.body string. Without
  // either (pure offline), the section is omitted. Rendered as text (XSS-safe).
  function appendBodySection(b, p) {
    const canFetch = typeof STATE.data.fetchBody === "function";
    if (!canFetch && p.body == null) return;
    b.appendChild(el("div", { class:"group-title", text:"content" }));
    const holder = el("div", {});
    b.appendChild(holder);
    const show = text => {
      clear(holder);
      if (!text || !text.trim()) { holder.appendChild(el("div", { class:"empty", text:"(empty)" })); return; }
      holder.appendChild(el("pre", { text:text }));
    };
    if (p.body != null) { show(p.body); return; }
    const btn = el("button", { class:"btn ghost" }, "Show content");
    btn.onclick = async () => {
      btn.disabled = true; btn.textContent = "Loading…";
      try { show(await STATE.data.fetchBody(p.name)); }
      catch (err) { clear(holder); holder.appendChild(el("div", { class:"empty", text:"Could not load: " + err.message })); }
    };
    holder.appendChild(btn);
  }

  // Generic on-demand-content drawer section for domains without an inline
  // body in their metadata snapshot (work/docs — see `appendBodySection`
  // above for memory's variant, which additionally supports a pre-injected
  // `p.body` string). `fetcher` is null when the host supplies no hook
  // (pure offline export) — the section is simply omitted, same as memory's.
  function appendFetchedSection(b, fetcher) {
    if (!fetcher) return;
    b.appendChild(el("div", { class:"group-title", text:"content" }));
    const holder = el("div", {});
    b.appendChild(holder);
    const btn = el("button", { class:"btn ghost" }, "Show content");
    btn.onclick = async () => {
      btn.disabled = true; btn.textContent = "Loading…";
      try {
        const text = await fetcher();
        clear(holder);
        holder.appendChild(el("pre", { text: (text && text.trim()) ? text : "(empty)" }));
      } catch (err) {
        clear(holder);
        holder.appendChild(el("div", { class:"empty", text:"Could not load: " + err.message }));
      }
    };
    holder.appendChild(btn);
  }

  // ---------------- WORK ITEM EDIT (Etappe D — the one write path) ----------------
  // Host-optional the same way fetchWorkIndex/fetchWorkStatus are: the
  // "Bearbeiten" button above only appears when fetchWorkFields exists, and
  // every function below assumes it was called because that check passed.
  const _WORK_KIND_OPTIONS = ["goal", "step", "note", "decision", "changelog"];
  const _WORK_STATUS_OPTIONS = ["open", "active", "done", "dropped", "superseded"];
  const _EMPTY_EVIDENCE = { commits: [], files: [] };
  const _EMPTY_REUSE = { searched_for: [], found: [], conclusion: "", uses: [], extends: [], creates: [], modules: [] };

  // Flat field spec for the edit form. `path` addresses either a top-level
  // WorkItem field ("title") or a nested one ("evidence.commits") — nested
  // paths are re-grouped into {evidence:{...}}/{reuse:{...}} objects by
  // _collectWorkUpdates before they ever reach the backend, because
  // WorkEngine.apply_update REPLACES a nested object wholesale rather than
  // merging it field-by-field — sending only the touched sub-field would
  // silently blank out every sibling the form didn't render a change for.
  const _WORK_EDIT_FIELDS = [
    { path:"title", label:"Titel", type:"text" },
    { path:"kind", label:"Kind", type:"select", options:_WORK_KIND_OPTIONS },
    { path:"status", label:"Status", type:"select", options:_WORK_STATUS_OPTIONS },
    { path:"theme", label:"Theme", type:"text" },
    { path:"opened", label:"Opened", type:"date" },
    { path:"closed", label:"Closed", type:"date", nullable:true },
    { path:"part_of", label:"Part of", type:"text", nullable:true },
    { path:"amends", label:"Amends", type:"text", nullable:true },
    { path:"supersedes", label:"Supersedes", type:"text", nullable:true },
    { path:"blocked_by", label:"Blocked by (ein Key pro Zeile)", type:"list" },
    { path:"plan_path", label:"Plan path", type:"text", nullable:true },
    { path:"unblocked_by", label:"Unblocked by", type:"text", nullable:true },
    { path:"requires_owner", label:"Requires owner", type:"checkbox" },
    { path:"migrated", label:"Migrated", type:"checkbox" },
    { path:"evidence.commits", label:"Evidence — Commits (ein Hash pro Zeile)", type:"list" },
    { path:"evidence.files", label:"Evidence — Files (ein Pfad pro Zeile)", type:"list" },
    { path:"reuse.searched_for", label:"Kanten — gesucht (ein Begriff pro Zeile)", type:"list" },
    { path:"reuse.found", label:"Kanten — gefunden (ein Eintrag pro Zeile)", type:"list" },
    { path:"reuse.conclusion", label:"Kanten — Entscheidung", type:"textarea" },
    { path:"reuse.uses", label:"Kanten — nutzt (datei.py::Symbol pro Zeile)", type:"list" },
    { path:"reuse.extends", label:"Kanten — erweitert", type:"list" },
    { path:"reuse.creates", label:"Kanten — baut", type:"list" },
    { path:"reuse.modules", label:"Kanten — Module", type:"list" },
    { path:"body", label:"Body", type:"textarea", large:true },
  ];

  function _getPath(obj, path) {
    let v = obj;
    for (const p of path.split(".")) v = (v == null) ? undefined : v[p];
    return v;
  }

  function _buildSelectInput(spec, value) {
    const input = el("select", { class:"search" });
    for (const opt of spec.options) {
      const o = el("option", { value:opt, text:opt });
      if (opt === value) o.setAttribute("selected", "selected");
      input.appendChild(o);
    }
    return { input, getValue:() => input.value };
  }
  function _buildCheckboxInput(_spec, value) {
    const input = el("input", { type:"checkbox" });
    if (value) input.checked = true;
    return { input, getValue:() => input.checked };
  }
  function _buildListInput(_spec, value) {
    const input = el("textarea", { class:"search", rows:"3" });
    input.value = Array.isArray(value) ? value.join("\n") : "";
    return { input, getValue:() => input.value.split("\n").map(s => s.trim()).filter(Boolean) };
  }
  function _buildTextareaInput(spec, value) {
    const input = el("textarea", { class:"search", rows: spec.large ? "10" : "3" });
    input.value = value || "";
    return { input, getValue:() => input.value };
  }
  function _buildDateInput(_spec, value) {
    const input = el("input", { class:"search", type:"date" });
    input.value = value || "";
    return { input, getValue:() => input.value || null };
  }
  function _buildTextInput(spec, value) {
    const input = el("input", { class:"search", type:"text" });
    input.value = (value == null) ? "" : value;
    const getValue = spec.nullable ? (() => input.value.trim() || null) : (() => input.value);
    return { input, getValue };
  }
  const _WORK_EDIT_INPUT_BUILDERS = {
    select: _buildSelectInput, checkbox: _buildCheckboxInput, list: _buildListInput,
    textarea: _buildTextareaInput, date: _buildDateInput,
  };

  // Builds one labeled form row for `spec`, seeded from `value`. Returns
  // the row DOM node, a getValue() reading the CURRENT input state back
  // out in the field's native type, and the raw input element (so the
  // caller can attach a single shared "this form is dirty" listener).
  function _workEditFieldRow(spec, value) {
    const row = el("div", { class:"field-row" });
    row.appendChild(el("label", { class:"field-label", text:spec.label }));
    const build = _WORK_EDIT_INPUT_BUILDERS[spec.type] || _buildTextInput;
    const { input, getValue } = build(spec, value);
    row.appendChild(input);
    return { row, input, getValue };
  }

  // Reads every field row back into an updates object shaped for the
  // backend. Only a field/group whose CURRENT value actually differs from
  // `original` is included — an untouched evidence/reuse form must not
  // manufacture an empty-but-present block where none existed (the whole
  // store treats "kanten: {}" as meaningfully different from "no kanten
  // block" — see WorkEdges.searched()'s own docstring). Both sides of the
  // comparison are normalized through the same empty-defaults shape so
  // "never had reuse" and "form left at its untouched defaults" compare
  // equal instead of a phantom diff.
  function _collectWorkUpdates(fieldStates, original) {
    const flat = {};
    for (const fs of fieldStates) flat[fs.spec.path] = fs.getValue();
    const updates = {};
    const groups = {};
    for (const fs of fieldStates) {
      const parts = fs.spec.path.split(".");
      if (parts.length === 2) {
        const [top, sub] = parts;
        groups[top] = groups[top] || {};
        groups[top][sub] = flat[fs.spec.path];
      } else {
        const before = _getPath(original, fs.spec.path);
        const after = flat[fs.spec.path];
        if (JSON.stringify(before) !== JSON.stringify(after)) updates[fs.spec.path] = after;
      }
    }
    for (const top in groups) {
      const defaults = top === "evidence" ? _EMPTY_EVIDENCE : _EMPTY_REUSE;
      const before = { ...defaults, ..._getPath(original, top) };
      const after = groups[top];
      if (JSON.stringify(before) !== JSON.stringify(after)) updates[top] = after;
    }
    return updates;
  }

  async function _startWorkEdit(key) {
    const b = $("drawer-body"); clear(b);
    b.appendChild(el("div", { class:"empty", text:"Lade Felder…" }));
    let fields;
    try { fields = await STATE.data.fetchWorkFields(key); }
    catch (e) {
      clear(b);
      b.appendChild(el("div", { class:"empty", text:"Konnte Felder nicht laden: " + ((e && e.message) || e) }));
      return;
    }
    _renderWorkEditForm(key, fields);
  }

  function _renderWorkEditForm(key, fields) {
    const b = $("drawer-body"); clear(b);
    b.appendChild(el("h2", { text:"Bearbeiten: " + fields.title }));
    b.appendChild(el("div", { class:"sub", text:key }));

    const form = el("div", { class:"edit-form" });
    const fieldStates = [];
    let lastPreviewedUpdates = null;

    const previewOut = el("div", {});
    const previewBtn = el("button", { class:"btn", text:"Vorschau" });
    const saveBtn = el("button", { class:"btn", text:"Speichern" });
    saveBtn.disabled = true;

    function markDirty() { lastPreviewedUpdates = null; saveBtn.disabled = true; }

    for (const spec of _WORK_EDIT_FIELDS) {
      const value = _getPath(fields, spec.path);
      const fs = _workEditFieldRow(spec, value);
      fs.spec = spec;
      fieldStates.push(fs);
      fs.input.addEventListener("input", markDirty);
      fs.input.addEventListener("change", markDirty);
      form.appendChild(fs.row);
    }
    b.appendChild(form);

    previewBtn.onclick = async () => {
      const updates = _collectWorkUpdates(fieldStates, fields);
      clear(previewOut);
      if (Object.keys(updates).length === 0) {
        previewOut.appendChild(el("div", { class:"empty", text:"Keine Änderungen." }));
        return;
      }
      previewOut.appendChild(el("div", { class:"empty", text:"Prüfe…" }));
      try {
        const result = await STATE.data.previewWorkUpdate(key, updates);
        clear(previewOut);
        previewOut.appendChild(el("pre", { class:"ledger", text: result.diff || "(keine textuelle Änderung)" }));
        lastPreviewedUpdates = updates;
        saveBtn.disabled = false;
      } catch (e) {
        clear(previewOut);
        previewOut.appendChild(el("div", { class:"empty", text:"Validierung fehlgeschlagen: " + ((e && e.message) || e) }));
      }
    };

    saveBtn.onclick = async () => {
      if (!lastPreviewedUpdates) return;
      saveBtn.disabled = true;
      try {
        await STATE.data.saveWorkUpdate(key, lastPreviewedUpdates);
        clear(previewOut);
        previewOut.appendChild(el("div", { class:"empty",
          text:"Gespeichert. Die Work-Liste zeigt die Änderung erst nach einem Neuladen der Seite." }));
      } catch (e) {
        previewOut.appendChild(el("div", { class:"empty", text:"Speichern fehlgeschlagen: " + ((e && e.message) || e) }));
        saveBtn.disabled = false;
      }
    };

    const cancelBtn = el("button", { class:"btn ghost", text:"Abbrechen" });
    cancelBtn.onclick = () => { const item = STATE.data.work && STATE.data.work.items.find(x => x.key === key); if (item) openWorkItem(item); };

    b.appendChild(el("div", { class:"chips" }, previewBtn, saveBtn, cancelBtn));
    b.appendChild(previewOut);
  }
  function matchWork(i) {
    if (!STATE.q) return true;
    return ((i.key||"")+(i.title||"")+(i.theme||"")+(i.kind||"")).toLowerCase().includes(STATE.q);
  }

  function renderDocs(c) {
    const dc = STATE.data.docs;
    if (!dc || !Array.isArray(dc.sections)) {
      const msg = STATE.data.docsError
        ? "Could not load doc sections: " + STATE.data.docsError
        : "No docs.json — run: context-toolkit-query --export-studio <dir>";
      c.appendChild(el("div", { class:"empty", text: msg }));
      return;
    }
    const sections = (dc.sections || []).filter(matchDoc);
    if (dc.stats) {
      const s = el("div", { class:"summary" });
      s.appendChild(el("span", {}, el("b", { text:String(dc.stats.sections) }), " sections"));
      s.appendChild(el("span", {}, el("b", { text:String(dc.stats.files) }), " files"));
      c.appendChild(s);
    }
    const byPath = {}; for (const s of sections) (byPath[s.path] = byPath[s.path] || []).push(s);
    let shown = 0;
    for (const p of Object.keys(byPath).sort()) {
      c.appendChild(el("div", { class:"group-title", text:p + " · " + byPath[p].length }));
      for (const s of byPath[p]) { c.appendChild(docRow(s)); shown++; }
    }
    if (!shown) c.appendChild(el("div", { class:"empty", text:"No sections match the filter." }));
  }
  function docRow(s) {
    const row = el("div", { class:"row", onclick:()=>openDocSection(s) });
    row.appendChild(el("span", { class:"nm", text:s.heading || "(lead-in)" }));
    row.appendChild(el("span", { class:"meta", text:"line " + s.line + " · " + fmtBytes(s.bytes) }));
    return row;
  }
  function openDocSection(s) {
    const b = $("drawer-body"); clear(b);
    b.appendChild(el("h2", { text:s.heading || "(lead-in)" }));
    b.appendChild(el("div", { class:"sub", text:s.path + " · line " + s.line }));
    // fetchDocBody returns the WHOLE file (sections aren't individually
    // addressable server-side, see admin_context_studio.py's docstring) —
    // the drawer shows it in full; `line` above is the scroll/search hint.
    appendFetchedSection(b, typeof STATE.data.fetchDocBody === "function" ? () => STATE.data.fetchDocBody(s.path) : null);
    openDrawer();
  }
  function matchDoc(s) {
    if (!STATE.q) return true;
    return ((s.path||"")+(s.heading||"")).toLowerCase().includes(STATE.q);
  }

  // ---------------- PENDING (consolidation flag-ledger) ----------------
  // The persistent "human decides" backlog a consolidation pass writes but does
  // NOT auto-resolve. Host-injectable: window.CONTEXT_DATA.pending (a string) or
  // .fetchPending() (-> Promise<string>). Rendered as plain text (XSS-safe).
  async function renderPending() {
    const c = $("content"); clear(c);
    c.appendChild(el("div", { class:"summary" }, el("span", {
      text:"Pending — items a consolidation pass flagged for human decision (not auto-resolved)." })));
    const body = el("div", {});
    c.appendChild(body);

    let text = STATE.data.pending;
    if (text == null && typeof STATE.data.fetchPending === "function") {
      body.appendChild(el("div", { class:"empty", text:"Loading…" }));
      try { text = await STATE.data.fetchPending(); }
      catch (err) { clear(body); body.appendChild(el("div", { class:"empty", text:"Could not load pending: " + err.message })); return; }
      clear(body);
    }
    if (text == null) {
      body.appendChild(el("div", { class:"empty", text:"No pending ledger — a host supplies it via CONTEXT_DATA.fetchPending() or .pending." }));
      return;
    }
    if (!text.trim()) { body.appendChild(el("div", { class:"empty", text:"Nothing pending — the ledger is empty." })); return; }
    body.appendChild(el("pre", { class:"ledger", text:text }));
  }

  // ---------------- STATUS (KPI tiles — store health without an MCP call) ----------------
  // Fetched on demand (like Pending), not at boot — most sessions never open this tab, so
  // loadData() does not pay for it unconditionally. Cached in STATE.data once fetched;
  // undefined = not yet successfully fetched (still worth retrying — a transient error is
  // NOT cached as a permanent "unavailable", unlike a missing loader function, which never
  // becomes available mid-session and is checked separately below).
  function kpiTile(label, value, sub) {
    return el("div", { class:"kpi-tile" },
      el("div", { class:"kpi-value", text:value }),
      el("div", { class:"kpi-label", text:label }),
      el("div", { class:"kpi-sub", text:sub || "" }),
    );
  }

  async function _fetchStatusSource(dataKey, loaderKey, errorKey) {
    if (STATE.data[dataKey] !== undefined) return;
    if (typeof STATE.data[loaderKey] !== "function") return;
    // Cache the IN-FLIGHT PROMISE, not just its eventual result — a rapid
    // tab-switch-away-and-back while the first fetch is still running must
    // reuse it, not fire a second ~2.5s request against the same source
    // (W8-Reviewer-Fund, mct-Context-Studio-Vollausbau Etappe B WARNING-4).
    const promiseKey = dataKey + "Promise";
    if (!STATE.data[promiseKey]) {
      // Loader call wrapped in .then(), not passed directly to
      // Promise.resolve() — a host loader is only CONTRACTUALLY required to
      // be "a function in window.CONTEXT_DATA", not an async one; a plain
      // function that throws SYNCHRONOUSLY would escape Promise.resolve()
      // before it has a chance to wrap the call, and .catch() below would
      // never see it (W8-Reviewer-Fund NEU-1: caught via a synchronous-throw
      // test case the delta review added specifically for this).
      STATE.data[promiseKey] = Promise.resolve().then(() => STATE.data[loaderKey]())
        .then(result => { STATE.data[dataKey] = result; delete STATE.data[errorKey]; })
        .catch(e => {
          // dataKey stays undefined on error (WARNING-3) — a transient
          // failure (network blip, an expired session mid-fetch) must not
          // be cached as permanently unavailable; the NEXT tab-open retries.
          STATE.data[errorKey] = (e && e.message) ? String(e.message) : String(e);
          console.error("[context-studio] " + loaderKey + "() failed:", e);
        })
        .finally(() => { delete STATE.data[promiseKey]; });
    }
    await STATE.data[promiseKey];
  }

  function _renderWorkStatusTiles(grid) {
    const ws = STATE.data.workStatus;
    if (!ws) {
      grid.appendChild(el("div", { class:"empty",
        text: STATE.data.workStatusError ? "Work-Status: " + STATE.data.workStatusError : "Kein Work-Status verfügbar (kein Host-Loader konfiguriert)." }));
      return;
    }
    grid.appendChild(kpiTile("Work-Items gesamt", String(ws.total_items), ws.recommendation));
    grid.appendChild(kpiTile("Aufräumen fällig", String(ws.closeable_goals + ws.dangling_refs + ws.plan_path_broken),
      "abschließbare Ziele + hängende Referenzen + kaputte Plan-Pfade"));
    grid.appendChild(kpiTile("Reuse ungeprüft", String(ws.reuse_not_checked), "Records ohne aufgezeichnete Reuse-Suche"));
    grid.appendChild(kpiTile("Ladefehler", String(ws.load_errors), "Dateien beim Laden verworfen"));
  }

  function _renderMemoryStatusTiles(grid) {
    const ms = STATE.data.memoryStatus;
    if (!ms) {
      grid.appendChild(el("div", { class:"empty",
        text: STATE.data.memoryStatusError ? "Memory-Status: " + STATE.data.memoryStatusError : "Kein Memory-Status verfügbar (kein Host-Loader konfiguriert)." }));
      return;
    }
    grid.appendChild(kpiTile("Memory — Ledger-Größe", String(ms.total),
      Object.entries(ms.tiers || {}).map(([t, n]) => t + ": " + n).join(" · ")));
    const brokenLinks = Object.values(ms.broken_links || {}).reduce((a, b) => a + b.length, 0);
    grid.appendChild(kpiTile("Kaputte Links", String(brokenLinks), "[[link]]-Ziele ohne Treffer"));
    grid.appendChild(kpiTile("Orphans", String((ms.orphans || []).length), "nicht in MEMORY.md referenziert"));
    grid.appendChild(kpiTile("Stale Pointers", String((ms.stale_pointers || []).length), "MEMORY.md verweist auf fehlende Datei"));
  }

  async function renderStatus() {
    const c = $("content"); clear(c);
    c.appendChild(el("div", { class:"summary" }, el("span", {
      text:"Status — store health at a glance (work_status + memory_lint), no MCP tool call needed." })));
    const grid = el("div", { class:"kpi-grid" });
    c.appendChild(grid);

    // Measured at ~2.5s for the work-store source on the real TALOS tree —
    // an empty grid for that long reads as broken, not slow (W8-Reviewer-
    // Fund WARNING-5). Shown only when a fetch is actually about to happen.
    const _statusSources = [["workStatus", "fetchWorkStatus"], ["memoryStatus", "fetchMemoryStatus"]];
    const willFetch = _statusSources.some(([dataKey, loaderKey]) =>
      STATE.data[dataKey] === undefined && typeof STATE.data[loaderKey] === "function");
    if (willFetch) grid.appendChild(el("div", { class:"empty", text:"Loading…" }));

    await Promise.all([
      _fetchStatusSource("workStatus", "fetchWorkStatus", "workStatusError"),
      _fetchStatusSource("memoryStatus", "fetchMemoryStatus", "memoryStatusError"),
    ]);
    // Re-check STATE.mode: the fetches above can straddle a tab switch — a
    // slow fetch resolving after the user already left the Status tab must
    // not clear/repopulate whatever tab is showing now.
    if (STATE.mode !== "status") return;
    clear(grid);
    _renderWorkStatusTiles(grid);
    _renderMemoryStatusTiles(grid);
  }

  // ---------------- GRAPH (memory link graph via Cytoscape) ----------------
  // Nodes = packages, edges = the resolved [[link]] graph from memory.json.edges.
  // Node colour = tier, node size scales with frecency heat. Click a node → its
  // drawer (reuses openPackage). Cytoscape is optional: absent → a hint, no crash.
  let _cy = null;
  function renderGraph() {
    const c = $("content"); clear(c);
    const mem = STATE.data.memory;
    if (!mem || !Array.isArray(mem.packages)) {
      c.appendChild(el("div", { class:"empty", text:"No memory.json — run: context-toolkit-query --export-studio <dir>" })); return;
    }
    if (typeof window.cytoscape !== "function") {
      c.appendChild(el("div", { class:"empty", text:"Graph needs cytoscape.min.js next to index.html — re-run: context-toolkit-query --export-studio <dir>" })); return;
    }
    const pkgs = mem.packages, edges = Array.isArray(mem.edges) ? mem.edges : [];
    // Tier + neutral colours read from the CSS variables so the graph follows the
    // active theme (dark/light). Falls back to the dark defaults if a var is unset.
    const css = (name, fb) => { const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim(); return v || fb; };
    const tierColor = { core:css("--core","#7c9cf0"), project:css("--project","#54c1b8"),
                        user:css("--user","#e0b15a"), unknown:css("--unknown","#8b94a6") };
    const edgeColor = css("--line","#2a313d");
    const labelColor = css("--muted","#8b94a6");
    const selBorder = css("--fg","#e3e8f0");

    const s = el("div", { class:"summary" });
    s.appendChild(el("span", {}, el("b", { text:String(pkgs.length) }), " nodes"));
    s.appendChild(el("span", {}, el("b", { text:String(edges.length) }), " edges"));
    s.appendChild(el("span", { class:"meta", text:"click a node to open · scroll to zoom · drag to pan" }));
    const legend = el("div", { class:"glegend" });
    for (const t of ["core","project","user","unknown"]) {
      const dot = el("i"); dot.style.background = tierColor[t];
      legend.appendChild(el("span", {}, dot, t));
    }
    s.appendChild(legend);
    c.appendChild(s);

    const host = el("div", { class:"graph" });
    c.appendChild(host);

    const maxHeat = Math.max(0.001, ...pkgs.map(p => p.heat || 0));
    const names = new Set(pkgs.map(p => p.name));
    const byName = {}; for (const p of pkgs) byName[p.name] = p;
    const nodes = pkgs.map(p => ({ data: {
      id: p.name, label: p.name, color: tierColor[p.tier] || tierColor.unknown,
      size: 16 + Math.round(24 * (p.heat || 0) / maxHeat),
    }}));
    const links = edges
      .filter(e => e && names.has(e.source) && names.has(e.target))
      .map(e => ({ data: { id: "e:" + e.source + "->" + e.target, source: e.source, target: e.target } }));

    _cy = window.cytoscape({
      container: host,
      elements: nodes.concat(links),
      style: [
        { selector: "node", style: {
          "background-color": "data(color)", "width": "data(size)", "height": "data(size)",
          "label": "data(label)", "color": labelColor, "font-size": "7px",
          "min-zoomed-font-size": 9, "text-halign": "center", "text-valign": "bottom",
          "text-margin-y": 2 } },
        { selector: "edge", style: {
          "width": 1, "line-color": edgeColor, "target-arrow-color": edgeColor,
          "target-arrow-shape": "triangle", "arrow-scale": 0.7, "curve-style": "bezier",
          "opacity": 0.75 } },
        { selector: "node:selected", style: { "border-width": 2, "border-color": selBorder } },
      ],
      layout: { name: "cose", animate: false, nodeRepulsion: 9000, idealEdgeLength: 75, padding: 24 },
      wheelSensitivity: 0.2,
    });
    _cy.on("tap", "node", evt => { const p = byName[evt.target.id()]; if (p) openPackage(p); });
  }

  // ---------------- filters / helpers ----------------
  function filterItems(items) {
    if (!STATE.q) return items;
    const q = STATE.q;
    return items.filter(it => (
      (it.id||"") + (it.title||"") + (it.op||"") + (it.detail||"")
    ).toLowerCase().includes(q));
  }
  function matchPkg(p) {
    if (!STATE.q) return true;
    return ((p.name||"")+(p.description||"")+(p.tier||"")+(p.members||[]).join(" ")).toLowerCase().includes(STATE.q);
  }
  function matchRule(r) {
    if (!STATE.q) return true;
    return ((r.key||"")+(r.title||"")+(r.summary||"")+(r.short_id||"")+(r.tags||[]).join(" ")).toLowerCase().includes(STATE.q);
  }
  function fmtBytes(n) { n = n||0; return n < 1024 ? n+" B" : (n/1024).toFixed(1)+" KB"; }
  function setStatus(t) { $("status").textContent = t || ""; }

  function openDrawer() { $("drawer").classList.add("open"); $("scrim").classList.add("open"); }
  function closeDrawer() { $("drawer").classList.remove("open"); $("scrim").classList.remove("open"); }

  // ---------------- routing ----------------
  function render() {
    $("tab-review").classList.toggle("active", STATE.mode === "review");
    $("tab-browse").classList.toggle("active", STATE.mode === "browse");
    $("tab-graph").classList.toggle("active", STATE.mode === "graph");
    $("tab-pending").classList.toggle("active", STATE.mode === "pending");
    $("tab-status").classList.toggle("active", STATE.mode === "status");
    $("export").style.display = STATE.mode === "review" ? "" : "none";
    // Search only drives review/browse; hide it where it does nothing (graph
    // would re-layout on every keystroke, pending/status are plain summaries).
    $("search").style.display = (STATE.mode === "review" || STATE.mode === "browse") ? "" : "none";
    if (STATE.mode === "review") renderReview();
    else if (STATE.mode === "browse") renderBrowse();
    else if (STATE.mode === "graph") renderGraph();
    else if (STATE.mode === "status") renderStatus();
    else renderPending();
  }

  $("tab-review").onclick = () => { STATE.mode = "review"; render(); };
  $("tab-browse").onclick = () => { STATE.mode = "browse"; render(); };
  $("tab-graph").onclick = () => { STATE.mode = "graph"; render(); };
  $("tab-pending").onclick = () => { STATE.mode = "pending"; render(); };
  $("tab-status").onclick = () => { STATE.mode = "status"; render(); };
  $("search").addEventListener("input", e => { STATE.q = e.target.value.trim().toLowerCase(); render(); });
  $("export").onclick = exportDecision;
  $("drawer-close").onclick = closeDrawer;
  $("scrim").onclick = closeDrawer;
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

  // Theme toggle: flip the data-theme attr + persist to localStorage. Re-renders the
  // graph (if open) so Cytoscape picks up the new edge/label colours.
  $("theme-toggle").onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
    const next = cur === "light" ? "dark" : "light";
    if (next === "light") document.documentElement.setAttribute("data-theme","light");
    else document.documentElement.removeAttribute("data-theme");
    try { localStorage.setItem("ctx-theme", next); } catch(_){}
    if (STATE.mode === "graph" && _cy) renderGraph();
  };

  // ---------------- boot ----------------
  (async function () {
    STATE.data = await loadData();
    const has = k => STATE.data[k] && (STATE.data[k].items || STATE.data[k].packages || STATE.data[k].rules || STATE.data[k].sections);
    // Open on whichever mode has data; default review.
    if (!has("diff") && (has("memory") || has("rules") || has("work") || has("docs"))) STATE.mode = "browse";
    const parts = [];
    if (STATE.data.diff && STATE.data.diff.items) parts.push(STATE.data.diff.items.length + " proposals");
    if (STATE.data.memory && STATE.data.memory.packages) parts.push(STATE.data.memory.packages.length + " packages");
    if (STATE.data.rules && STATE.data.rules.rules) parts.push(STATE.data.rules.rules.length + " rules");
    if (STATE.data.work && STATE.data.work.items) parts.push(STATE.data.work.items.length + " work items");
    if (STATE.data.docs && STATE.data.docs.sections) parts.push(STATE.data.docs.sections.length + " doc sections");
    setStatus(parts.join(" · "));
    render();
  })();
  </script>
</body>
</html>
